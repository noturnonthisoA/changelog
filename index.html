<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-lang="zh" data-view="champions" data-mode="rift" data-show-classic="false">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0b" id="metaThemeColor" />
    <meta name="description" content="MasterAio 更新日志 · MasterAio Changelog" />
    <title>MasterAio · 更新日志</title>
    <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg" />
    <script>
      /* 首屏应用主题/语言，避免浅色或英文用户看到错误主题闪烁。 */
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var themeParam = params.get('theme');
          var langParam = params.get('lang');
          var storedTheme = null;
          var storedLang = null;
          try {
            storedTheme = window.localStorage.getItem('mlog.theme');
            storedLang = window.localStorage.getItem('mlog.lang');
          } catch (error) {}
          var theme =
            themeParam === 'light' || themeParam === 'dark'
              ? themeParam
              : storedTheme === 'light' || storedTheme === 'dark'
                ? storedTheme
                : 'dark';
          var lang =
            langParam === 'zh' || langParam === 'en'
              ? langParam
              : storedLang === 'zh' || storedLang === 'en'
                ? storedLang
                : 'zh';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-lang', lang);
          root.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
          var viewParam = params.get('view');
          var modeParam = params.get('mode');
          root.setAttribute('data-view', viewParam === 'updates' ? 'updates' : 'champions');
          root.setAttribute('data-mode', modeParam === 'classic' ? 'classic' : 'rift');
        } catch (error) {}
      })();
    </script>
    <link rel="stylesheet" href="./assets/css/theme.css" />
    <link rel="stylesheet" href="./assets/css/app.css" />
  </head>
  <body>
    <a class="skip-link" id="skipLink" href="#detail" data-i18n="skipToContent">跳到内容</a>

    <div class="page">
      <div class="window" id="appWindow">
        <header class="titlebar" id="titlebar">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
                <path d="M12 2.6 21.4 12 12 21.4 2.6 12Z" />
                <path d="M7.6 16V8.4L12 12.8l4.4-4.4V16" stroke-width="1.9" stroke-linecap="round" />
              </svg>
            </span>
            <span class="brand-name" id="brandName">MasterAio</span>
            <span class="brand-divider" aria-hidden="true"></span>
            <span class="brand-tag" id="brandTag" data-i18n="changelog">更新日志</span>
          </div>

          <nav class="view-nav" id="viewNav" role="tablist" aria-label="视图切换" data-i18n-aria="viewSwitch">
            <button class="view-btn" type="button" role="tab" data-view-btn="champions" data-i18n="viewChampions" aria-selected="true">英雄图鉴</button>
            <button class="view-btn" type="button" role="tab" data-view-btn="updates" data-i18n="viewUpdates" aria-selected="false">总更新</button>
          </nav>

          <div class="search" id="searchWrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-3.6-3.6"></path>
            </svg>
            <input
              class="search-input"
              id="searchInput"
              type="search"
              autocomplete="off"
              spellcheck="false"
              enterkeyhint="search"
              placeholder="搜索更新内容…"
              aria-label="搜索更新内容"
              data-i18n-ph="searchPlaceholder"
              data-i18n-aria="searchLabel"
            />
            <button class="search-clear" id="searchClear" type="button" hidden aria-label="清空搜索" data-i18n-aria="clearSearch">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18"></path>
              </svg>
            </button>
          </div>

          <div class="titlebar-actions">
            <button
              class="icon-btn search-toggle"
              id="searchToggle"
              type="button"
              aria-label="搜索"
              aria-expanded="false"
              aria-controls="searchWrap"
              data-i18n-aria="search"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20l-3.6-3.6"></path>
              </svg>
            </button>

            <div class="lang-toggle" role="group" aria-label="语言" data-i18n-aria="language">
              <button class="lang-btn" id="langZh" type="button" data-lang="zh" aria-pressed="true" aria-label="中文" data-i18n-aria="chinese">中</button>
              <button class="lang-btn" id="langEn" type="button" data-lang="en" aria-pressed="false" aria-label="English" data-i18n-aria="english">EN</button>
            </div>

            <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="切换到浅色" data-i18n-aria="switchToLight">
              <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>
              </svg>
              <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z"></path>
              </svg>
            </button>

            <a
              class="icon-btn github-link"
              id="githubLink"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              hidden
              aria-label="打开 GitHub 仓库"
              title="打开 GitHub 仓库"
              data-i18n-aria="openGithub"
              data-i18n-title="openGithub"
            >
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path
                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                ></path>
              </svg>
            </a>
          </div>
        </header>

        <div class="window-body" id="windowBody">
          <main class="champions-view" id="championsView" aria-busy="true">
            <div class="champ-head">
              <div class="champ-head-title">
                <h1 class="champ-title" data-i18n="viewChampions">英雄图鉴</h1>
                <span class="champ-count" id="championCount"></span>
              </div>
              <div class="mode-switch" id="modeSwitch" role="group" aria-label="模式切换" data-i18n-aria="modeSwitch">
                <button class="mode-btn" type="button" data-mode-btn="rift" data-i18n="modeRift" aria-pressed="true">峡谷</button>
                <button class="mode-btn" type="button" data-mode-btn="classic" data-i18n="modeClassic" aria-pressed="false">经典</button>
              </div>
            </div>
            <div class="champ-sub">
              <label class="only-updated" for="onlyUpdated">
                <input type="checkbox" id="onlyUpdated" />
                <span data-i18n="onlyUpdated">仅看有更新</span>
              </label>
            </div>
            <div class="champion-grid" id="championGrid" aria-busy="true"></div>
            <div class="champion-status" id="championStatus" hidden></div>
          </main>

          <aside class="sidebar" id="sidebar">
            <div class="sidebar-head">
              <h2 class="sidebar-title" data-i18n="releases">更新记录</h2>
            </div>
            <div class="release-filter" id="releaseFilter" role="group" aria-label="版本模式过滤" data-i18n-aria="filterLabel">
              <button class="filter-chip" type="button" data-version-filter="all" data-i18n="filterAll" aria-pressed="true">全部</button>
              <button class="filter-chip" type="button" data-version-filter="rift" data-i18n="filterRift" aria-pressed="false">峡谷</button>
              <button class="filter-chip" type="button" data-version-filter="classic" data-i18n="filterClassic" aria-pressed="false">经典</button>
            </div>
            <nav class="release-list" id="releaseList" aria-label="版本列表" data-i18n-aria="releasesNav" aria-busy="true">
              <div class="release-skeleton" aria-hidden="true">
                <div class="release-skel-row">
                  <span class="skel skel-badge"></span>
                  <span class="skel-lines"><span class="skel skel-line"></span><span class="skel skel-line skel-line-sm"></span></span>
                </div>
                <div class="release-skel-row">
                  <span class="skel skel-badge"></span>
                  <span class="skel-lines"><span class="skel skel-line"></span><span class="skel skel-line skel-line-sm"></span></span>
                </div>
                <div class="release-skel-row">
                  <span class="skel skel-badge"></span>
                  <span class="skel-lines"><span class="skel skel-line"></span><span class="skel skel-line skel-line-sm"></span></span>
                </div>
                <div class="release-skel-row">
                  <span class="skel skel-badge"></span>
                  <span class="skel-lines"><span class="skel skel-line"></span><span class="skel skel-line skel-line-sm"></span></span>
                </div>
              </div>
            </nav>
          </aside>

          <main class="detail" id="detail" tabindex="-1" aria-busy="true">
            <div class="detail-inner detail-skeleton" role="status">
              <span class="sr-only">加载中…</span>
              <div class="skel skel-title"></div>
              <div class="skel skel-meta"></div>
              <div class="skel skel-section-head"></div>
              <div class="skel skel-row"></div>
              <div class="skel skel-row is-85"></div>
              <div class="skel skel-row is-70"></div>
              <div class="skel skel-gap"></div>
              <div class="skel skel-section-head"></div>
              <div class="skel skel-row"></div>
              <div class="skel skel-row is-85"></div>
              <div class="skel skel-row is-70"></div>
              <div class="skel skel-gap"></div>
              <div class="skel skel-section-head"></div>
              <div class="skel skel-row"></div>
              <div class="skel skel-row is-85"></div>
            </div>
          </main>

          <button class="back-top" id="backToTop" type="button" aria-label="回到顶部" title="回到顶部" data-i18n-aria="backToTop" data-i18n-title="backToTop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5M5 12l7-7 7 7"></path>
            </svg>
          </button>
        </div>

        <footer class="footer" id="footer">
          <time class="footer-item" id="footerUpdated"></time>
          <span class="footer-spacer" aria-hidden="true"></span>
          <span class="footer-credit">Developer by 念旧</span>
          <a class="footer-github" id="footerGithub" href="#" target="_blank" rel="noopener noreferrer" hidden>GitHub</a>
        </footer>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>

    <div class="champion-dialog" id="championDialog" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="championDialogName">
      <div class="champion-dialog-overlay" data-dialog-close="1"></div>
      <div class="champion-dialog-panel" role="document">
        <div class="champion-dialog-banner" id="championBanner">
          <img class="champion-banner-img" id="championBannerImg" crossorigin="anonymous" alt="" hidden />
          <span class="champion-banner-fallback" id="championBannerFallback" aria-hidden="true"></span>
          <div class="champion-banner-gradient" aria-hidden="true"></div>
          <button class="champion-dialog-close" id="championDialogClose" type="button" aria-label="关闭" data-i18n-aria="closeDialog" data-i18n-title="closeDialog" title="关闭">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
          <div class="champion-banner-head">
            <span class="champion-dialog-avatar" id="championDialogAvatar"></span>
            <div class="champion-banner-text">
              <h2 class="champion-dialog-name" id="championDialogName"></h2>
              <p class="champion-dialog-title" id="championDialogTitle"></p>
            </div>
          </div>
        </div>
        <div class="champion-dialog-body">
          <div class="champion-metrics" id="championMetrics"></div>
          <div class="dialog-mode-tabs" id="dialogModeTabs" role="group" aria-label="模式切换" data-i18n-aria="modeSwitch">
            <button class="dialog-mode-btn" type="button" data-dialog-mode="rift" data-i18n="modeRift" aria-pressed="true">峡谷</button>
            <button class="dialog-mode-btn" type="button" data-dialog-mode="classic" data-i18n="modeClassic" aria-pressed="false">经典</button>
          </div>
          <div class="champion-dialog-groups" id="championDialogGroups"></div>
        </div>
      </div>
    </div>

    <div class="sr-only" id="liveRegion" role="status" aria-live="polite"></div>

    <noscript>
      <p style="position: fixed; inset: auto 16px 16px; margin: 0; padding: 10px 14px; background: #161618; color: #f1f1f2; border: 1px solid #f2c14e; border-radius: 8px; font: 13px sans-serif; z-index: 200">
        MasterAio 更新日志需要启用 JavaScript。 / This changelog requires JavaScript.
      </p>
    </noscript>

    <div class="boot-hint" id="bootHint" hidden>
      <strong>页面脚本未能加载 / Script not loaded</strong>
      <span>请通过本地服务器打开：<code>python update/serve.py</code>（file:// 协议无法读取 changelog/*.txt）</span>
      <span>Serve this page over HTTP: <code>python update/serve.py</code> (fetch cannot read txt via file://)</span>
    </div>

    <script type="module" src="./assets/js/app.js"></script>
    <script>
      /* 兜底提示：模块脚本被浏览器拦截（常见于直接双击 file:// 打开）时给出可操作提示。 */
      (function () {
        function showHint() {
          if (document.documentElement.getAttribute('data-app-ready') === '1') return;
          document.documentElement.classList.add('boot-failed');
          var node = document.getElementById('bootHint');
          if (node) node.hidden = false;
        }
        window.addEventListener('load', function () {
          setTimeout(showHint, window.location.protocol === 'file:' ? 300 : 6000);
        });
      })();
    </script>
  </body>
</html>
